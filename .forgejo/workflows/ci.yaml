# Next.js build. Tekton pipeline: nextjs-app-build.
# CI scripts live in .forgejo/scripts/
# Org variables: REGISTRY, TOOLKIT_IMAGE, RABBITMQ_HOST, MINIO_URL, CORE_BUCKET
# Org secrets: HARBOR_USERNAME, HARBOR_PASSWORD, RABBITMQ_USERNAME, RABBITMQ_PASSWORD, MINIO_ACCESS_KEY, MINIO_SECRET_KEY
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: lowops
    container:
      image: ${{ vars.TOOLKIT_IMAGE }}
      volumes:
        - /srv/shared:/srv/shared
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      correlation: ${{ steps.open.outputs.correlation }}
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        # Bootstrap clone stays inline: repo scripts are not on disk yet.
        # Later jobs reuse this script with *repo-checkout.
        run: &repo-checkout |
          set -eu
          if [ -n "${APT_PACKAGES:-}" ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ${APT_PACKAGES}
          fi
          if [ -n "${APK_PACKAGES:-}" ]; then
            apk add --no-cache ${APK_PACKAGES}
          fi
          base="${SERVER%/}"
          case "$base" in
            https://*) origin="https://oauth2:${TOKEN}@${base#https://}" ;;
            http://*) origin="http://oauth2:${TOKEN}@${base#http://}" ;;
            *) origin="http://oauth2:${TOKEN}@${base}" ;;
          esac
          git init .
          git remote add origin "${origin}/${REPO}.git"
          git fetch --depth 1 origin "$SHA"
          git checkout FETCH_HEAD

      - name: Register build
        id: open
        env:
          APP: ${{ github.event.repository.name }}
          COMMIT: ${{ github.sha }}
          REQUESTER: user/${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: python .forgejo/scripts/register_build.py

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          APP: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DOCKER_CONFIG: /kaniko/.docker
          CORRELATION: ${{ steps.open.outputs.correlation }}
          SHA: ${{ github.sha }}
        run: bash .forgejo/scripts/build_push.sh

  scan:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: aquasec/trivy:0.63.0
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Trivy
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          CORRELATION: ${{ needs.build.outputs.correlation }}
        run: |
          set -eu
          set +e
          trivy image --username "$HARBOR_USERNAME" --password "$HARBOR_PASSWORD" \
            --format json --output scan-result.json --timeout 15m "${{ needs.build.outputs.image }}"
          status=$?
          set -e
          if [ -f scan-result.json ] && [ -n "${CORRELATION:-}" ]; then
            mkdir -p "/srv/shared/${CORRELATION}"
            cp scan-result.json "/srv/shared/${CORRELATION}/scan-result.json"
          fi
          exit "$status"

  unit-test:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: node:22-alpine
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          APK_PACKAGES: git
        run: *repo-checkout
      - name: npm test
        env:
          CORRELATION: ${{ needs.build.outputs.correlation }}
        run: bash .forgejo/scripts/unit_test.sh

  lint:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: node:22-alpine
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          APK_PACKAGES: git
        run: *repo-checkout
      - name: ESLint
        env:
          CORRELATION: ${{ needs.build.outputs.correlation }}
        run: bash .forgejo/scripts/lint.sh

  notify:
    needs: [build, scan, unit-test, lint]
    if: always()
    runs-on: lowops
    container:
      image: ${{ vars.TOOLKIT_IMAGE }}
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: *repo-checkout
      - name: Publish build result
        env:
          APP: ${{ github.event.repository.name }}
          COMMIT: ${{ github.sha }}
          REQUESTER: user/${{ github.actor }}
          CORRELATION: ${{ needs.build.outputs.correlation }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ needs.build.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_URL: ${{ vars.MINIO_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          CORE_BUCKET: ${{ vars.CORE_BUCKET }}
          LOWOPS_UNIT_TEST_FILE: unit-test.json
        run: python .forgejo/scripts/publish_build.py
